# ============================================================
# LucidDreamer.AI — Master Wrangler Configuration
# ============================================================
# This is the canonical config for the main worker deployment.
# The gallery worker and Pages site have their own configs
# generated by deploy.sh (or can use inline configs).
# ============================================================

name = "luciddreamer"
main = "../player/feedback-worker.js"
compatibility_date = "2024-12-01"
compatibility_flags = ["nodejs_compat"]

[vars]
version = "1.0.0"
environment = "production"

# ─── D1 Database ─────────────────────────────────────────────
[[d1_databases]]
binding = "DB"
database_name = "luciddreamer-db"
database_id = ""  # filled by deploy.sh after creation

# ─── KV Namespace ────────────────────────────────────────────
[[kv_namespaces]]
binding = "FEEDBACK"
id = ""  # filled by deploy.sh after creation

# ─── R2 Bucket ───────────────────────────────────────────────
[[r2_buckets]]
binding = "AUDIO"
bucket_name = "luciddreamer-audio"

# ─── Vectorize Index ─────────────────────────────────────────
[[vectorize]]
binding = "IDEAS"
index_name = "luciddreamer-ideas"

# ─── Workers AI ──────────────────────────────────────────────
[ai]
binding = "AI"

# ============================================================
# Gallery Worker — separate deploy target
# ============================================================
# Deployed via: wrangler deploy --config deploy/gallery-wrangler.toml
# (generated by deploy.sh)

# ============================================================
# Pages — player site
# ============================================================
# Deployed via: wrangler pages deploy ../player --project-name luciddreamer-player
