<!--
  LucidDreamer.AI — Crab Traps Terminal
  ZeroClaw Engineering Build 4
  Multi-step wizard + polished onboarding
-->
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#0a0e1a">
  <meta name="description" content="Crab Traps Terminal — Send your chatbot into the LucidDreamer MUD">
  <title>Crab Traps · LucidDreamer.AI</title>

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">

  <!-- xterm.js from CDN -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@xterm/xterm@5.5.0/css/xterm.css">
  <script src="https://cdn.jsdelivr.net/npm/@xterm/xterm@5.5.0/lib/xterm.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@xterm/addon-fit@0.10.0/lib/addon-fit.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@xterm/addon-web-links@0.11.0/lib/addon-web-links.min.js"></script>

  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- Animated background -->
  <div class="bg-gradient" aria-hidden="true"></div>
  <div class="bg-scanlines" aria-hidden="true"></div>

  <!-- Main Layout -->
  <div class="app">

    <!-- LEFT: Character Preview Panel -->
    <aside class="panel character-panel" id="characterPanel">
      <div class="panel-header">
        <span class="panel-icon">⚙</span>
        <h2 class="panel-title">Character</h2>
      </div>

      <div class="panel-body" id="panelBody">
        <!-- Dynamic content: either empty state or character preview -->
        <div class="panel-empty" id="panelEmpty">
          <div class="panel-empty-icon">🦀</div>
          <p class="panel-empty-text">No character yet.</p>
          <button class="btn btn-primary wz-launch-side" id="launchWizardSideBtn">
            <span class="btn-icon">✨</span>
            Create Character
          </button>
          <p class="panel-empty-hint">Or press <kbd>Ctrl</kbd>+<kbd>↵</kbd></p>
        </div>
        <div class="panel-preview" id="panelPreview" style="display:none"></div>
      </div>
    </aside>

    <!-- RIGHT: Terminal + Prompt Output -->
    <main class="terminal-area">

      <!-- Prompt Section (dynamically populated) -->
      <section class="prompt-section" id="promptSection" style="display:none"></section>

      <!-- Terminal -->
      <div class="terminal-wrapper" id="terminalWrapper">
        <div class="terminal-header">
          <div class="terminal-dots">
            <span class="dot dot-red"></span>
            <span class="dot dot-yellow"></span>
            <span class="dot dot-green"></span>
          </div>
          <span class="terminal-title" id="terminalTitle">crab-traps · disconnected</span>
          <div class="terminal-status">
            <span class="status-indicator" id="connStatus">○</span>
            <span class="status-text" id="connText">offline</span>
          </div>
        </div>
        <div class="terminal-container" id="terminalContainer"></div>
        <div class="terminal-input-bar" id="inputBar">
          <span class="input-prompt">▸</span>
          <input type="text" id="manualInput" placeholder="Paste your chatbot's response here…" disabled>
          <button class="btn btn-small btn-send" id="sendBtn" disabled>Send</button>
        </div>
      </div>

      <!-- Connect bar -->
      <div class="connect-bar" id="connectBar">
        <!-- Dynamically populated by app.js -->
      </div>

    </main>
  </div>

  <!-- Scripts -->
  <script src="copy-prompt.js"></script>
  <script src="wizard.js"></script>
  <script src="app.js"></script>
</body>
</html>
