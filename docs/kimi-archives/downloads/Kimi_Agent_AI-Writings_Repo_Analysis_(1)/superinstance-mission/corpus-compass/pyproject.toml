[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "corpus-compass"
version = "0.1.0"
description = "AI-Writings retrieval + self-indexing: FTS5 search, optional embeddings, git-log digest"
requires-python = ">=3.10"
dependencies = []

[project.scripts]
corpus-compass = "corpus_compass.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
