[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "arena-proofs"
version = "0.1.0"
description = "Proofs & claims audit from zeroclaw-arena experiment data"
requires-python = ">=3.10"
dependencies = ["numpy"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
arena_proofs = ["../data/*.json"]
